<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="title desc">
  <title id="title">Apogee predictor flow</title>
  <desc id="desc">A simple monochrome pipeline showing sensors, estimator, apogee model, target check, and flaps.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill: #f7f7f4; }
      .box { fill: #fff; stroke: #cfcfca; stroke-width: 1.3; }
      .soft { fill: #efefeb; stroke: #cfcfca; stroke-width: 1.3; }
      .line { fill: none; stroke: #111; stroke-width: 1.8; marker-end: url(#arrow); }
      .axis { fill: none; stroke: #111; stroke-width: 1.2; }
      .target { fill: none; stroke: #111; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .prediction { fill: none; stroke: #111; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .altitude { fill: none; stroke: #777; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; }
      .muted { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #777; }
      .title { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <rect class="bg" width="980" height="380"/>

  <text class="txt title" x="48" y="48">apogee predictor flow</text>
  <text class="muted small" x="48" y="72">fresh data in, predicted apogee out, flaps only when confidence is good</text>

  <g transform="translate(48 112)">
    <rect class="box" x="0" y="0" width="128" height="76"/>
    <text class="txt label" x="22" y="32">sensors</text>
    <text class="muted small" x="22" y="53">baro + imu</text>

    <path class="line" d="M144 38H184"/>

    <rect class="box" x="200" y="0" width="128" height="76"/>
    <text class="txt label" x="219" y="32">estimator</text>
    <text class="muted small" x="219" y="53">state seed</text>

    <path class="line" d="M344 38H384"/>

    <rect class="box" x="400" y="0" width="128" height="76"/>
    <text class="txt label" x="422" y="32">model</text>
    <text class="muted small" x="422" y="53">rollout</text>

    <path class="line" d="M544 38H584"/>

    <rect class="box" x="600" y="0" width="128" height="76"/>
    <text class="txt label" x="622" y="32">target</text>
    <text class="muted small" x="622" y="53">high / low</text>

    <path class="line" d="M744 38H784"/>

    <rect class="soft" x="800" y="0" width="112" height="76"/>
    <text class="txt label" x="820" y="32">flaps</text>
    <text class="muted small" x="820" y="53">drag</text>
  </g>

  <g transform="translate(48 230)">
    <rect class="box" x="0" y="0" width="560" height="92"/>
    <text class="txt label" x="22" y="32">failure behavior</text>
    <text class="muted small" x="22" y="56">stale, bad-frame, out-of-table, or uncertain data</text>
    <text class="muted small" x="22" y="74">commands 0 deg through the normal flap path</text>
  </g>

  <g transform="translate(652 222)">
    <rect class="box" x="0" y="0" width="228" height="100"/>
    <path class="axis" d="M30 74H202M30 22V74"/>
    <path class="target" d="M30 34H202"/>
    <path class="altitude" d="M30 70 C70 67 102 56 132 45 C156 37 180 34 202 36"/>
    <path class="prediction" d="M30 60 C68 39 104 30 138 34 C164 37 184 35 202 34"/>
    <text class="muted small" x="30" y="91">altitude</text>
    <text class="txt small" x="142" y="91">prediction</text>
  </g>
</svg>

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	-DUSB_SERIAL
	-D__IMXRT1062__
	-DARDUINO_TEENSY41
	-mcpu=cortex-m7
	-mfpu=fpv5-sp-d16
	-mfloat-abi=hard
	-mthumb
	-fno-unwind-tables
	-fno-asynchronous-unwind-tables
	-Wno-psabi

[env:release]
extends = env
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-O3
	-ffast-math
	-funsafe-math-optimizations
	-funroll-loops
	-fno-exceptions
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:safe_math]
extends = env
build_flags = 
	${env.build_flags}
	-O3
	-funroll-loops
	-fno-exceptions
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:debug]
extends = env
build_type = debug
build_flags = 
	${env.build_flags}
	-Og
	-g3
	-fno-exceptions
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:size_opt]
extends = env
build_flags = 
	${env.build_flags}
	-Os
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:flight]
extends = env

upload_protocol = teensy-cli
build_flags =
	${env.build_flags}
	-Ofast
	-ffast-math
	-funsafe-math-optimizations
	-funroll-loops
	-flto
	-fno-exceptions
	-DENABLE_SERIAL_LOGGING=1
	-DDATA_LOGGER_BUFFER_SIZE=16384
	-DDATA_LOGGER_FLUSH_INTERVAL_US=200000
	-DAPOGEE_PREDICTOR_MAX_STEPS=256
lib_deps =
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:native]
platform = native
board = native
framework = 
build_flags =
	-std=c++17
	-Isrc
test_build_src = false

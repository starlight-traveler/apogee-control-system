; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
board = teensy41
framework = arduino
lib_ignore =
	SparkFun LSM9DS1 IMU
build_flags = 
	-DUSB_SERIAL
	-D__IMXRT1062__
	-DARDUINO_TEENSY41
	-mcpu=cortex-m7
	-mfpu=fpv5-sp-d16
	-mfloat-abi=hard
	-mthumb
	-fno-unwind-tables
	-fno-asynchronous-unwind-tables
	-Wno-psabi
	-Ilib/sbgECom/common
	-Ilib/sbgECom/src

[env:release]
extends = env
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-O3
	-ffast-math
	-funsafe-math-optimizations
	-funroll-loops
	-fno-exceptions
	-DDATA_LOGGER_BUFFER_SIZE=32768
	-DDATA_LOGGER_FLUSH_INTERVAL_US=200000
	-DDATA_LOGGER_SYNC_INTERVAL_US=2000000
	-DDATA_LOGGER_MIN_FLUSH_BYTES=4096
	-DDATA_LOGGER_PREALLOCATE_BYTES=1048576
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_BNO08x_Arduino_Library.git
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:safe_math]
extends = env
build_flags = 
	${env.build_flags}
	-O3
	-funroll-loops
	-fno-exceptions
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_BNO08x_Arduino_Library.git
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:debug]
extends = env
build_type = debug
build_flags = 
	${env.build_flags}
	-Og
	-g3
	-fno-exceptions
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_BNO08x_Arduino_Library.git
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:size_opt]
extends = env
build_flags = 
	${env.build_flags}
	-Os
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_BNO08x_Arduino_Library.git
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:flight]
extends = env
upload_protocol = teensy-cli
build_flags = 
	${env.build_flags}
	-Ofast
	-ffast-math
	-funsafe-math-optimizations
	-funroll-loops
	-flto
	-fno-exceptions
	-DENABLE_SERIAL_LOGGING=0
	-DDATA_LOGGER_BUFFER_SIZE=32768
	-DDATA_LOGGER_FLUSH_INTERVAL_US=200000
	-DDATA_LOGGER_SYNC_INTERVAL_US=2000000
	-DDATA_LOGGER_MIN_FLUSH_BYTES=4096
	-DDATA_LOGGER_PREALLOCATE_BYTES=1048576
	-DAPOGEE_PREDICTOR_MAX_STEPS=256
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BMP5xx Library
	adafruit/Adafruit BNO055
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_BNO08x_Arduino_Library.git
	https://github.com/RobTillaart/MS5611_SPI.git
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
	sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:native]
platform = native
board = native
framework = 
build_flags = 
	-std=c++17
	-Isrc
test_build_src = false
lib_deps = sparkfun/SparkFun BNO080 Cortex Based IMU@^1.1.12

[env:icm_calibration]
extends = env
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-I./src
	-I./calibration
	-O2
	-fno-exceptions
	-DACS_BUILD_ICM20948_CALIBRATION=1
build_src_filter =
	-<*>
	+<../calibration/icm20948_advanced.cpp>
lib_deps = 
	https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git

[env:lsm9ds1_calibration]
extends = env
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-I./src
	-I./calibration
	-O2
	-fno-exceptions
	-DACS_BUILD_LSM9DS1_CALIBRATION=1
build_src_filter =
	-<*>
	+<../calibration/lsm9ds1_advanced.cpp>
lib_deps = 
	https://github.com/sparkfun/SparkFun_LSM9DS1_Arduino_Library.git

[env:pulse20_calibration]
extends = env
monitor_speed = 115200
build_flags =
	${env.build_flags}
	-I./src
	-I./calibration
	-O2
	-fno-exceptions
	-DACS_BUILD_PULSE20_CALIBRATION=1
build_src_filter =
	-<*>
	+<../calibration/pulse20_advanced.cpp>
	+<../src/sbg_teensy_platform.cpp>
lib_deps =
	sbgECom

[env:reefwing_lsm9ds1_test]
extends = env
monitor_speed = 115200
build_flags =
	${env.build_flags}
	-I./src
	-I./calibration
	-O2
	-fno-exceptions
	-DACS_BUILD_REEFWING_LSM9DS1_TEST=1
	-DBOARD_NAME=\"Teensy41\"
build_src_filter =
	-<*>
	+<../calibration/reefwing_lsm9ds1_test.cpp>
lib_deps =
	https://github.com/Reefwing-Software/Reefwing-LSM9DS1.git
	https://github.com/Reefwing-Software/Reefwing-imuTypes.git
	https://github.com/Reefwing-Software/Reefwing-AHRS.git
